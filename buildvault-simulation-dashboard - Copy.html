const icons={files:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5h6l2 2h8v11H4z"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m5 12 4 4L19 6"/></svg>',alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 2.8 20h18.4zM12 9v5M12 17h.01"/></svg>',copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>'};
function tag(text,type='gray'){return `<span class="tag ${type}">${esc(text)}</span>`}
function basis(k){if(k?.includes('conflict'))return tag('Conflicting','purple');if(k?.includes('missing'))return tag('Evidence gap','red');if(k?.includes('inference'))return tag('Inference','amber');if(k?.includes('unsupported'))return tag('Unsupported','gray');return tag('Documented','green')}
function status(s){if(s==='analysed')return tag('Analysed','green');if(s==='empty')return tag('Empty','gray');if(s.includes('unsupported'))return tag('Unsupported format','gray');if(s.includes('media'))return tag('Media only','blue');return tag('Limited content','amber')}
function cls(s){if(s==='documented complete')return tag('Documented complete','green');if(s==='documented in progress')return tag('In progress','blue');if(s==='conflicting evidence')return tag('Conflicting','purple');if(s==='not evidenced')return tag('Not evidenced','red');return tag(s,'gray')}
function head(kicker,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function panelTitle(title,sub='',link=''){return `<div class="panel-title"><div><h2>${title}</h2>${sub?`<span>${sub}</span>`:''}</div>${link?`<button class="link-btn" data-go="${link}">View details ↗</button>`:''}</div>`}
function metric(label,value,foot,icon,color='cyan'){let c={cyan:['#1b3445','#70d8e7','rgba(98,216,232,.08)'],blue:['#1d2f4a','#8ebaff','rgba(109,169,255,.08)'],lime:['#263626','#b5e685','rgba(181,230,133,.08)'],amber:['#3a3021','#f2c879','rgba(242,200,121,.08)']}[color];return `<div class="panel metric" style="--iconbg:${c[0]};--icon:${c[1]};--glow:${c[2]}"><div class="metric-top">${label}<span class="metric-icon">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function overview(){let timeline=DATA.timeline.slice(-6).reverse();return `${head('PROJECT OVERVIEW','Atlas Rover','A single view of project evidence, progress, and the work ahead.',`<button class="btn" data-go="reports">${icons.copy} Project report</button><button class="btn primary" data-go="actions">View next actions ↗</button>`)}
<div class="grid kpis">${metric('Files in workspace',inv.files.length,'Across project folders',icons.files)}${metric('Documented events',DATA.timeline.length,'Evidence-linked timeline',icons.clock,'blue')}${metric('Requirements complete',r.complete,'Of 10 tracked requirements',icons.check,'lime')}${metric('Evidence gaps',r.notEvidenced,'Requirements without proof',icons.alert,'amber')}</div>
<div class="grid overview-grid"><section class="panel project-card"><div class="project-top"><div><div class="eyebrow">Active engineering project</div><div class="project-title">${esc(DATA.meta.project.replace(' (SYNTHETIC)',''))}</div><div class="project-sub">Autonomous environmental monitoring · Project Atlas</div></div><span class="pill"><span class="dot"></span> In progress</span></div><div class="project-meta"><div class="meta-item"><small>Project phase</small><strong>Prototype validation</strong></div><div class="meta-item"><small>Evidence set</small><strong>${DATA.analysedCount} analysed files</strong></div><div class="meta-item"><small>Last documented activity</small><strong>01 Jun 2025</strong></div></div><div class="progress-area"><div class="progress-label"><span>Requirement classification</span><span>${r.complete} of 10 documented complete</span></div><div class="progress-track"><div class="progress-fill" style="width:${r.complete*10}%"></div></div></div></section>
<section class="panel chart-wrap">${panelTitle('Requirement status','Classification across the evidence set')}<div class="req-bars">${[['Documented complete',r.complete,'#b5e685'],['In progress',r.inProgress,'#78b8ff'],['Not evidenced',r.notEvidenced,'#f08b8b'],['Conflicting',r.conflicting,'#c4a5ff']].map(x=>`<div class="req-row"><label>${x[0]}</label><div class="bar-track"><div class="bar-fill" style="width:${x[1]*10}%;background:${x[2]}"></div></div><b>${x[1]}</b></div>`).join('')}</div><div class="footnote">Classification counts only. No percentage-completion score is inferred.</div></section></div>
<div class="grid lower-grid"><section class="panel panel-pad">${panelTitle('Recent project evidence','Latest dated entries from source documents','timeline')}<div class="activity-list">${timeline.map(e=>`<div class="activity"><div class="activity-icon">${icons.clock}</div><div class="activity-main"><strong>${esc(e.event)}</strong><span>${esc(e.source)} · ${basis(e.basis)}</span></div><div class="activity-date">${e.date}</div></div>`).join('')}</div></section>
<section class="panel panel-pad">${panelTitle('Recommended next move','Highest-priority action','actions')}<div class="action-highlight"><div class="action-label">Next 15-minute action</div><h3>${esc(DATA.recommendations.next15Minute.action)}</h3><p>${esc(DATA.recommendations.next15Minute.reason)}</p><div class="action-footer"><span>Ready to start · Priority 1</span><button class="link-btn" data-go="actions">See all actions →</button></div></div><div style="display:flex;justify-content:space-between;gap:12px;margin-top:15px;color:var(--muted);font-size:10px"><span>Open decisions: ${DATA.registers.decisionRegister.filter(x=>x.approval.includes('unresolved')||x.approval.includes('deferred')).length}</span><span>Tests registered: ${DATA.registers.testRegister.length}</span></div></section></div>
<div class="footnote">Sample project data is used to demonstrate BuildVault's evidence-led workflow. Select “About” for demo details.</div>`}
function inventory(){return `${head('WORKSPACE / FILES','File inventory','Understand what is in the project workspace and how each source was handled.',`<button class="btn" id="exportFiles">${icons.copy} Export inventory</button>`)}<div class="stat-strip" style="margin-bottom:15px"><div class="mini-stat"><strong>${inv.files.length}</strong><span>Total files discovered</span></div><div class="mini-stat"><strong>${DATA.analysedCount}</strong><span>Analysed sources</span></div><div class="mini-stat"><strong>${unusable.length}</strong><span>Limited or unusable</span></div><div class="mini-stat"><strong>${inv.duplicateGroups.length}</strong><span>Duplicate groups</span></div></div><section class="panel table-panel"><div class="table-toolbar"><div><h2>Project files</h2><p>File identity, inferred purpose, analysis status, and source metadata</p></div><span class="mono">${inv.files.length} RECORDS</span></div><div class="table-wrap"><table id="filesTable"><thead><tr><th>File</th><th>Purpose</th><th>Status</th><th>Size</th><th>Modified</th></tr></thead><tbody>${inv.files.map(f=>`<tr><td><div class="file-name">${esc(f.path.split('/').pop())}</div><div class="file-path">${esc(f.path)}</div></td><td>${esc(f.purpose)}</td><td>${status(f.analysisStatus)}</td><td class="mono">${f.bytes.toLocaleString()} B</td><td class="mono">${esc(f.modified)}</td></tr>`).join('')}</tbody></table></div><div class="footnote" style="padding:14px 18px">Identical files are treated as one evidence source, not independent confirmation. ${inv.duplicateGroups.map(g=>g.files.map(esc).join(' / ')).join('; ')}</div></section>`}
function timeline(){let dates=DATA.timeline;return `${head('PROJECT HISTORY','Project timeline','A chronological view assembled from dated project documents.',`<button class="btn" id="exportTimeline">${icons.copy} Export timeline</button>`)}<div class="grid overview-grid"><section class="panel panel-pad">${panelTitle('Documented events',`${dates.length} dated entries · chronological source order`)}<div class="timeline">${dates.map(e=>`<div class="timeline-item"><div class="timeline-date">${e.date}</div><div class="timeline-text">${esc(e.event)}</div><div class="timeline-source">${basis(e.basis)} <span class="mono">${esc(e.source)}</span></div></div>`).join('')}</div></section><section class="panel panel-pad">${panelTitle('Dates needing clarification','Kept separate from confirmed chronology')}<p style="font-size:11px;color:var(--muted);margin-top:-4px">These entries are not assigned an invented date or sequence.</p>${DATA.ambiguousDates.map(d=>`<div class="evidence-card"><div class="evidence-head"><strong>${esc(d.text)}</strong>${tag('Date unclear','amber')}</div><div class="evidence-foot">${esc(d.reason)} · <span class="mono">${esc(d.source)}</span></div></div>`).join('')}</section></div>`}
function requirements(){return `${head('PROJECT CONTROL','Requirements &amp; milestones','Track what the project requirements say, what the records support, and what remains open.')}<div class="stat-strip" style="margin-bottom:15px">${[['Complete',r.complete,'green'],['In progress',r.inProgress,'blue'],['Not evidenced',r.notEvidenced,'red'],['Conflicting',r.conflicting,'purple']].map(x=>`<div class="mini-stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div><section class="panel table-panel"><div class="table-toolbar"><div><h2>Requirement register</h2><p>Each classification is tied to the available project evidence.</p></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Requirement</th><th>Status</th><th>Evidence summary</th><th>Verification</th></tr></thead><tbody>${DATA.milestones.map(m=>`<tr><td class="mono">${m.id}</td><td style="font-weight:600;color:#e3edf7">${esc(m.requirement)}</td><td>${cls(m.classification)}</td><td>${esc(m.evidence)}${m.evidenceNeeded?`<div class="file-path">Needed: ${esc(m.evidenceNeeded)}</div>`:''}${m.conflictValues?`<div class="file-path">${m.conflictValues.map(esc).join(' vs ')}</div>`:''}</td><td>${m.verifiedByTest?tag('Test recorded','green'):tag('Not test-verified','gray')}</td></tr>`).join('')}</tbody></table></div><div class="footnote" style="padding:14px 18px">“Not evidenced” means no supporting record was found in the reviewed files; it does not prove that work was never completed.</div></section>`}
function evidence(){return `${head('EVIDENCE QUALITY','Evidence review','Inspect conflicting values, missing records, and the sources needed to resolve them.')}<div class="grid split"><section class="panel panel-pad">${panelTitle('Conflicting specifications','Both readings are preserved')}<div class="evidence-card"><div class="evidence-head"><strong>Battery capacity</strong>${tag('Conflict','purple')}</div><div class="evidence-values"><div class="evidence-value"><small>Design revision record</small><b>5,200 mAh</b></div><div class="evidence-value"><small>Compiled summary</small><b>6,400 mAh</b></div></div><div class="evidence-foot">Resolution: physical inspection and an authoritative specification record.</div></div><div class="evidence-card"><div class="evidence-head"><strong>Enclosure ingress rating</strong>${tag('Conflict','purple')}</div><div class="evidence-values"><div class="evidence-value"><small>Design revision record</small><b>IP54</b></div><div class="evidence-value"><small>Compiled summary</small><b>IP65</b></div></div><div class="evidence-foot">Resolution: enclosure retest or a decision record naming the authoritative figure.</div></div><div class="evidence-card"><div class="evidence-head"><strong>Prototype site count</strong>${tag('Conflict','purple')}</div><div class="evidence-values"><div class="evidence-value"><small>Working notes</small><b>2 or 3</b></div><div class="evidence-value"><small>Calibration data</small><b>2 sites</b></div></div><div class="evidence-foot">Resolution: consult the survey notebook or repeat the site survey.</div></div></section>
<section class="panel panel-pad">${panelTitle('Missing evidence','Records needed to close the gaps')}${DATA.missing.map(m=>`<div class="evidence-card"><div class="evidence-head"><strong>${esc(m.claim)}</strong>${tag('Missing','red')}</div><div class="evidence-foot">Source: <span class="mono">${esc(m.source)}</span><br>Needed: ${esc(m.evidenceNeeded)}</div></div>`).join('')}</section></div><section class="panel panel-pad section-gap">${panelTitle('Analysis limitations','Sources that need another method or more content')}<div class="table-wrap"><table><thead><tr><th>File</th><th>Reason</th><th>Handling</th></tr></thead><tbody>${unusable.map(f=>`<tr><td class="mono">${esc(f.path)}</td><td>${esc(f.analysisStatus)}</td><td>${f.analysisStatus.includes('unsupported')?tag('Not interpreted','gray'):f.analysisStatus.includes('media')?tag('No usable evidence extracted','blue'):tag('Insufficient source content','amber')}</td></tr>`).join('')}</tbody></table></div></section>`}
function scope(){return `${head('CHANGE CONTROL','Scope changes','Separate approved project changes from proposals and unresolved scope questions.')}<section class="panel table-panel"><div class="table-toolbar"><div><h2>Scope assessment</h2><p>Change status is based on documented decisions and change requests.</p></div></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Finding</th><th>Authority / record</th><th>Source</th></tr></thead><tbody>${DATA.scope.map(s=>`<tr><td style="font-weight:600;color:#e2edf8">${esc(s.item)}</td><td>${s.finding==='approved scope expansion'?tag('Approved expansion','green'):s.finding==='unapproved suggestion'?tag('Proposal only','amber'):s.finding==='conflicting information'?tag('Conflicting','purple'):tag('Not evidenced','red')}</td><td>${esc(s.authority)}</td><td>${s.sources.map(x=>`<div class="mono">${esc(x)}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div><div class="footnote" style="padding:14px 18px">An approved expansion is not labelled scope creep. Unapproved suggestions remain proposals. Missing evidence is not treated as proof of unauthorized work.</div></section>`}
function registers(){let d=DATA.registers.decisionRegister,t=DATA.registers.testRegister,f=DATA.registers.failureRegister;return `${head('ENGINEERING RECORDS','Decisions &amp; tests','A traceable register of decisions, test outcomes, and recorded failures.')}<div class="grid kpis">${metric('Decisions recorded',d.length,'With documented authority',icons.check,'blue')}${metric('Tests registered',t.length,'Including incomplete records',icons.files)}${metric('Failures logged',f.length,'Documented incidents',icons.alert,'amber')}${metric('BOM rollup',`${DATA.registers.bom.total}`,'Documented credits · source values',icons.copy,'lime')}</div><section class="panel table-panel section-gap"><div class="table-toolbar"><div><h2>Decision register</h2><p>Decisions and their recorded approval status</p></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Date</th><th>Decision</th><th>Status</th><th>Source</th></tr></thead><tbody>${d.map(x=>`<tr><td class="mono">${x.id}</td><td class="mono">${x.date}</td><td>${esc(x.decision)}</td><td>${x.approval.includes('unresolved')?tag('Unresolved','purple'):x.approval.includes('deferred')||x.approval.includes('not approved')?tag('Deferred / not approved','amber'):tag('Recorded','green')}</td><td class="mono">${esc(x.source)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel table-panel section-gap"><div class="table-toolbar"><div><h2>Test register</h2><p>Measured outcomes and missing results</p></div></div><div class="table-wrap"><table><thead><tr><th>Test</th><th>Date</th><th>Requirement</th><th>Outcome</th><th>Result</th></tr></thead><tbody>${t.map(x=>`<tr><td class="mono">${x.id}</td><td class="mono">${x.date||'—'}</td><td>${esc(x.requirement)}</td><td>${esc(x.outcome)}</td><td>${x.met===true?tag('Passed','green'):x.met===false?tag('Not met','red'):tag('Incomplete','amber')}</td></tr>`).join('')}</tbody></table></div></section><section class="panel table-panel section-gap"><div class="table-toolbar"><div><h2>Failure register</h2><p>Symptoms, response, and cause status</p></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Date</th><th>Symptom</th><th>Action taken</th><th>Cause</th></tr></thead><tbody>${f.map(x=>`<tr><td class="mono">${x.id}</td><td class="mono">${x.date}</td><td>${esc(x.symptom)}</td><td>${esc(x.action)}</td><td>${x.causeStatus==='confirmed'?tag('Confirmed','green'):tag('Unknown','amber')}</td></tr>`).join('')}</tbody></table></div></section>`}
function actions(){return `${head('PROJECT MOMENTUM','Next actions','A prioritized list of practical steps linked to documented project gaps.',`<button class="btn" id="copyAction">${icons.copy} Copy top action</button>`)}<section class="panel" style="overflow:hidden"><div class="table-toolbar"><div><h2>Recommended actions</h2><p>Prioritized by the evidence gaps and project dependencies.</p></div><span class="mono">${DATA.recommendations.list.length} ACTIONS</span></div>${DATA.recommendations.list.map(x=>`<div class="rec-card"><div class="rec-num">${String(x.priority).padStart(2,'0')}</div><div><h3>${esc(x.action)}</h3><p>${esc(x.reason)}</p><div class="rec-meta"><span>↳ ${esc(x.dependsOn)}</span><span>·</span><span>Evidence: ${esc(x.evidenceNeeded)}</span></div><div class="rec-meta">${basis(x.basis)} <span>Closes: ${esc(x.closesGap)}</span></div></div></div>`).join('')}</section><section class="panel panel-pad section-gap"><div class="action-highlight"><div class="action-label">Start here · Next 15-minute action</div><h3>${esc(DATA.recommendations.next15Minute.action)}</h3><p>${esc(DATA.recommendations.next15Minute.reason)}</p><div class="action-footer"><span>Startable now · No dependency recorded</span><button class="btn primary" id="copyAction2">${icons.copy} Copy action</button></div></div><div class="footnote">This is a recommendation, not an action performed by the system. ${esc(DATA.recommendations.next15Minute.notCovered)}</div></section>`}
function reports(){let b=DATA.registers.bom;return `${head('PROJECT KNOWLEDGE','Reports &amp; handoff','A concise project summary designed to help another collaborator get up to speed.',`<button class="btn primary" id="downloadBrief">${icons.copy} Download handoff brief</button>`)}<div class="two-col"><section class="report-preview"><div class="report-kicker">BUILDVAULT / ENGINEERING BRIEF</div><h2>Atlas Rover</h2><p>Autonomous environmental monitoring rover. A structured snapshot of requirements, design history, decisions, tests, risks, and next steps.</p><div class="report-lines"><div><strong>${r.complete}/10</strong><span>Documented complete</span></div><div><strong>${DATA.registers.testRegister.length}</strong><span>Tests registered</span></div><div><strong>${b.total}</strong><span>BOM credits</span></div></div></section><section class="panel panel-pad">${panelTitle('Handoff snapshot','What a new collaborator needs to know')}<div class="manifest"><label>Project</label><div>Autonomous environmental monitoring rover, version 1.</div></div><div class="manifest"><label>Current state</label><div>${r.complete} requirements documented complete; ${r.inProgress} in progress; ${r.notEvidenced} not evidenced; ${r.conflicting} conflicting.</div></div><div class="manifest"><label>Key concern</label><div>Battery and ingress specifications have conflicting recorded values.</div></div><div class="manifest"><label>Next step</label><div>${esc(DATA.recommendations.next15Minute.action)}</div></div></section></div><section class="panel panel-pad section-gap">${panelTitle('Project manifest','Structured project memory')}<div class="manifest"><label>Identity</label><div>${esc(DATA.meta.project)}</div></div><div class="manifest"><label>Objectives</label><div>Temperature and humidity sensing, autonomous navigation, SD logging, waypoint upload, and environmental protection.</div></div><div class="manifest"><label>Specifications</label><div>Battery capacity and enclosure rating remain conflicting; total vehicle mass is not recorded.</div></div><div class="manifest"><label>Components &amp; costs</label><div>${b.lines.length} BOM lines · ${b.total} ${b.currency} recorded rollup.</div></div><div class="manifest"><label>Decisions</label><div>${DATA.registers.decisionRegister.length} recorded decisions, including one unresolved specification decision.</div></div><div class="manifest"><label>Tests</label><div>${DATA.registers.testRegister.length} registered tests; some have missing or ambiguous outcomes.</div></div><div class="manifest"><label>Revision history</label><div>REV-A → REV-B → REV-C, linked by explicit revision identifiers in the design revision record.</div></div></section><div class="footnote">The handoff view summarizes the sample evidence set. In a connected deployment, report creation and saving would depend on available platform capabilities and user approval.</div>`}
const views={overview,inventory,timeline,requirements,evidence,scope,registers,actions,reports};
function show(id){if(!views[id])id='overview';$('#content').innerHTML=views[id]();$('#crumb').textContent=$(`[data-view="${id}"]`)?.textContent.trim()||'Overview';$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));$('#sidebar').classList.remove('open');$('#globalSearch').value='';wire(id);window.scrollTo({top:0,behavior:'smooth'});}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function download(name,text,type='text/plain'){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast('File prepared for download')}
function wire(id){$$('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));if(id==='inventory'){$('#exportFiles')?.addEventListener('click',()=>download('buildvault-file-inventory.csv','Path,Purpose,Status,Bytes,Modified\n'+inv.files.map(f=>[f.path,f.purpose,f.analysisStatus,f.bytes,f.modified].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')))}if(id==='timeline')$('#exportTimeline')?.addEventListener('click',()=>download('buildvault-timeline.csv','Date,Event,Source,Basis\n'+DATA.timeline.map(e=>[e.date,e.event,e.source,e.basis].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')));if(id==='actions'){let fn=()=>{navigator.clipboard?.writeText(DATA.recommendations.next15Minute.action).then(()=>toast('Next action copied')).catch(()=>toast('Select and copy the action text'))};$('#copyAction')?.addEventListener('click',fn);$('#copyAction2')?.addEventListener('click',fn)}if(id==='reports')$('#downloadBrief')?.addEventListener('click',()=>{let txt=`BUILDVAULT — PROJECT HANDOFF BRIEF\n\n${DATA.meta.project}\n\nCURRENT STATE\n${r.complete} documented complete; ${r.inProgress} in progress; ${r.notEvidenced} not evidenced; ${r.conflicting} conflicting.\n\nKEY CONCERNS\nBattery capacity and enclosure ingress rating have conflicting recorded values. Vehicle mass is not recorded.\n\nNEXT ACTION\n${DATA.recommendations.next15Minute.action}\n\nDECISIONS\n${DATA.registers.decisionRegister.map(x=>x.id+' — '+x.decision+' ['+x.approval+']').join('\n')}\n\nTESTS\n${DATA.registers.testRegister.map(x=>x.id+' — '+x.outcome).join('\n')}\n\nThis brief summarizes sample project data in the BuildVault interactive demonstration.`;download('buildvault-handoff-brief.txt',txt)})}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)show(b.dataset.view)});$('#globalSearch').addEventListener('input',e=>{let q=e.target.value.toLowerCase();let rows=$$('#content tbody tr');rows.forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none');let cards=$$('#content .evidence-card, #content .rec-card, #content .timeline-item');cards.forEach(card=>card.style.display=card.textContent.toLowerCase().includes(q)?'':'none')});$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#helpBtn').addEventListener('click',()=>toast('Interactive BuildVault demo · Atlas Rover sample data · Local HTML prototype'));
$('#fileCount').textContent=inv.files.length;show('overview');
</script>
</body></html>
